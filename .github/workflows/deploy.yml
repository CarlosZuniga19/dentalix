name: Despliegue Dentalix

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Instalar y Compilar
      # Ya no entramos a dentalix-frontend, corremos esto en la raíz
      run: |
        npm install
        npm run build

    - name: Subir a Hostinger vía FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # Apuntamos directamente a la carpeta dist de la raíz
        local-dir: ./dist/ 
        server-dir: ./domains/dentalix.lat/public_html/