<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- ======================================================= -->
    <!-- 1. BOMBA LÓGICA (KAMIKAZE CACHE KILLER)                 -->
    <!-- Se ejecuta antes de que React o Vite puedan respirar    -->
    <!-- ======================================================= -->
    <script>
      (function() {
        // Destruye todo el almacenamiento profundo del Service Worker
        if ('caches' in window) {
          caches.keys().then(function(cacheNames) {
            cacheNames.forEach(function(cacheName) {
              caches.delete(cacheName);
              console.log('Hacker Mode: Caché zombie destruido ->', cacheName);
            });
          });
        }
        
        // Forzamos una recarga dura única alterando la URL
        const versionFuerzaBruta = 'dentalix_nuke_v1';
        if (!localStorage.getItem(versionFuerzaBruta)) {
          localStorage.setItem(versionFuerzaBruta, 'armado');
          // Le pegamos un timestamp a la URL para saltarnos cualquier caché del servidor o navegador
          window.location.href = window.location.href.split('?')[0] + '?v=' + new Date().getTime();
        }
      })();
    </script>
    
    <!-- ======================================================= -->
    <!-- 2. MUTACIÓN DEL MANIFEST (EL ENGAÑO MÁXIMO PARA iOS)    -->
    <!-- Inyectamos el manifest manual con un parámetro mutado   -->
    <!-- ======================================================= -->
    <link rel="manifest" href="/manifest.webmanifest?v=nuclear_1" />

    <!-- Actualizamos la firma de los iconos también por si las dudas -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=nuclear_1" />
    <link rel="apple-touch-icon" href="/apple-icon.png?v=nuclear_1" />
    
    <!-- Colores exactos para la barra superior -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
    
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Regresar a default permite que iOS respete el theme-color sin romper el diseño -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- ESTA ES LA LÍNEA CLAVE PARA QUE EN iOS DIGA DENTALIX Y NO EL NOMBRE DEL PROYECTO -->
    <meta name="apple-mobile-web-app-title" content="Dentalix" />

    <!-- Removido el viewport-fit=cover para respetar el Safe Area del iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- EL TÍTULO QUE LEE LA PC AL INSTALAR -->
    <title>Dentalix</title>
    
    <style>
      /* Regla Maestra para Modo Oscuro Dentalix */
      html.dark body { background-color: #111827 !important; color: #f9fafb !important; }
      html.dark .bg-white, html.dark .bg-surface { background-color: #1f2937 !important; border-color: #374151 !important; }
      html.dark .bg-background { background-color: #111827 !important; }
      html.dark .text-dark { color: #f9fafb !important; }
      html.dark .text-muted { color: #9ca3af !important; }
      html.dark .border-gray-100, html.dark .border-gray-200 { border-color: #374151 !important; }
      html.dark .bg-gray-50 { background-color: #374151 !important; }
      html.dark input, html.dark textarea, html.dark select { 
        background-color: #111827 !important; 
        color: #f9fafb !important; 
        border-color: #4b5563 !important; 
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
